name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor map dependencies and enrich main atlas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
            https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js \
            --output vendor/leaflet.js
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
            https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css \
            --output vendor/leaflet.css
          test -s vendor/leaflet.js
          test -s vendor/leaflet.css
          test -s android-main.js
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css",
              "vendor/leaflet.css",
          )
          text = text.replace(
              "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js",
              "vendor/leaflet.js",
          )
          text = text.replace(
              "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
              "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
          )
          if 'src="android-main.js"' not in text:
              text = text.replace("</body>", '<script src="android-main.js"></script></body>')
          p.write_text(text, encoding="utf-8")
          PY
          grep -q 'vendor/leaflet.js' index.html
          grep -q 'vendor/leaflet.css' index.html
          grep -q 'src="android-main.js"' index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
