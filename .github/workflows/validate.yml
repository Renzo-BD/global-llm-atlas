name: Validate atlas data
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate data and browser scripts
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          python scripts/validate_data.py
